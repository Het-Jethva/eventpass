# Local Postgres for development, so no Neon account is needed.
#
# The application connects through `@neondatabase/serverless`, which speaks
# WebSockets rather than the Postgres wire protocol. `wsproxy` bridges the two
# so local development exercises the *production* driver — including its
# pipelining and transaction semantics — against a local database, instead of a
# substituted `pg` driver that would hide differences.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:postgres@localhost:54432/eventpass npm run db:migrate
#   DATABASE_URL=postgresql://postgres:postgres@localhost:54432/eventpass npm run dev
#
# Ports are deliberately non-default: 5432 is commonly already claimed. They
# also sit below 55000, because Windows reserves scattered 100-port blocks from
# roughly 55321 up for Hyper-V — a published port landing inside one fails to
# bind with a permissions error rather than an in-use error.
services:
  postgres:
    image: postgres:17-alpine
    container_name: eventpass-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventpass
    ports:
      - "54432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventpass"]
      interval: 2s
      timeout: 3s
      retries: 20

  neon-proxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    container_name: eventpass-neon-proxy
    environment:
      APPEND_PORT: "postgres:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "54444:80"
    depends_on:
      postgres:
        condition: service_healthy
